[workspace]
members = ["crates/ocr-domain", "crates/ocr-engine", "crates/ocr-eval", "crates/ocr-parser-sandbox", "crates/ocr-service", "crates/ocr-store", "crates/ocr-temporal"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "time"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
bytes = "1.12"
futures-util = "0.3"
futures = "0.3"
libc = "0.2"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "timeout", "trace"] }
http-body-util = "0.1"
uuid = { version = "1.26", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "tiff", "webp"] }
jsonschema = { version = "0.53", default-features = false }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
ed25519-dalek = "=2.2.0"
hmac = "0.12"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "tls-roots", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
zeroize = "1.9"
time = { version = "0.3", features = ["formatting", "serde"] }
object_store = { version = "0.14.1", default-features = false, features = ["gcp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
base64 = "0.23"
gcp_auth = { version = "0.12.7", default-features = false, features = ["ring", "webpki-roots"] }
url = "2.5"
lopdf = { version = "0.44", default-features = false }
temporalio-client = { version = "=0.8.0", default-features = false }
temporalio-common = { version = "=0.8.0", default-features = false, features = ["serde_serialize"] }
temporalio-macros = "=0.8.0"
temporalio-sdk = { version = "=0.8.0", default-features = false }
temporalio-workflow = "=0.8.0"
fred = { version = "=10.1.0", default-features = false, features = ["enable-rustls", "i-keys"] }
unicode-normalization = "0.1"
