[workspace]
members = ["crates/ocr-domain", "crates/ocr-engine", "crates/ocr-service", "crates/ocr-store"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "timeout", "trace"] }
http-body-util = "0.1"
uuid = { version = "1.18", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "tiff", "webp"] }
