name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: tesserix/tesserix-workflows/.github/workflows/rust-ci.yml@62f7f663a98d5ef92567850dd03c8c2513c9068e
    with:
      toolchain: 1.85.0
      coverage_min_lines: 70

  secret-scan:
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@62f7f663a98d5ef92567850dd03c8c2513c9068e
