name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Verify locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo +1.85.0 fmt --check
      - name: Lint
        run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo +1.85.0 build --workspace --locked
      - name: Test
        run: cargo +1.85.0 test --workspace --locked
