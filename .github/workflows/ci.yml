name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: tesserix/tesserix-workflows/.github/workflows/rust-ci.yml@57cebb53e06629dab4fe88268810360623a19e0f
    with:
      toolchain: 1.94.0
      coverage_min_lines: 70
      database_enabled: true
      database_setup_script: scripts/setup-test-database.sh
      protoc_enabled: true

  secret-scan:
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@57cebb53e06629dab4fe88268810360623a19e0f

  container:
    uses: tesserix/tesserix-workflows/.github/workflows/container-ci.yml@57cebb53e06629dab4fe88268810360623a19e0f
    with:
      images: >-
