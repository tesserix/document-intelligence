name: release image

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-ocr-service:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: service
            file: Dockerfile
            image: ghcr.io/tesserix/document-intelligence/ocr-service
          - id: parser
            file: Dockerfile.parser
            image: ghcr.io/tesserix/document-intelligence/ocr-parser-sandbox
          - id: migrator
            file: Dockerfile.migrator
            image: ghcr.io/tesserix/document-intelligence/ocr-migrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:candidate-${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.id }}
      - name: Require clean runtime vulnerability scan
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:candidate-${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Publish verified image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.id }}
          provenance: mode=max
          sbom: true
      - name: Publish version alias
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}:${SOURCE_SHA}"

  advance-deploy-ref:
    needs: publish-ocr-service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Advance deploy ref after all verified images publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin deploy
          git merge-base --is-ancestor origin/deploy "${SOURCE_SHA}"
          git push origin "${SOURCE_SHA}:refs/heads/deploy"
