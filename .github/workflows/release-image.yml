name: release image

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-ocr-service:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/tesserix/document-intelligence/ocr-service:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          file: Dockerfile.parser
          push: true
          tags: ghcr.io/tesserix/document-intelligence/ocr-parser-sandbox:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Publish version aliases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main
          for image in ocr-service ocr-parser-sandbox; do
            docker buildx imagetools create \
              --tag "ghcr.io/tesserix/document-intelligence/${image}:${VERSION}" \
              "ghcr.io/tesserix/document-intelligence/${image}:${SOURCE_SHA}"
          done
      - name: Advance deploy ref after image publication
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git fetch origin deploy
          git merge-base --is-ancestor origin/deploy "${GITHUB_SHA}"
          git push origin "${GITHUB_SHA}:refs/heads/deploy"
